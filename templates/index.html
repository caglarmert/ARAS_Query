<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADEM · Synthetic Remote-Sensing Perception Study</title>
<style>
  :root{
    --bg:#f4f3ef; --surface:#ffffff; --surface-2:#faf9f6;
    --ink:#1d1d1a; --muted:#6f6e68; --faint:#9b9a93;
    --border:#e4e2db; --border-strong:#d3d1c8;
    --accent:#33506e; --accent-ink:#23384e; --accent-soft:#eaeef3;
    --good:#3f6b52; --warn:#9a5a3b;
    --r:10px; --r-sm:7px;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%;}
  body{
    font-family:var(--sans); background:var(--bg); color:var(--ink);
    line-height:1.55; -webkit-font-smoothing:antialiased;
    font-size:16px;
    height:100vh; display:flex; flex-direction:column; overflow:hidden;
  }
  main.wrap{flex:1 1 auto; overflow-y:auto; display:flex; flex-direction:column;}
  #screen{flex:1 0 auto; display:flex; flex-direction:column; justify-content:center;
    padding:20px 24px; box-sizing:border-box;}

  /* ---- top bar / progress ---- */
  header.bar{
    flex:none; background:var(--surface); border-bottom:1px solid var(--border);
    padding:12px 0;
  }
  .bar-inner{max-width:1000px; margin:0 auto; padding:0 24px;
    display:flex; align-items:center; justify-content:space-between; gap:24px;}
  .brand{font-weight:700; letter-spacing:.14em; font-size:13px; text-transform:uppercase; color:var(--accent-ink);}
  .brand span{color:var(--faint); font-weight:600; letter-spacing:.04em; text-transform:none; margin-left:10px;}
  .stages{display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end;}
  @media(max-width:760px){
    .brand span{display:none;}
    .stagepill{padding:5px 8px; font-size:11.5px;}
  }
  .stagepill{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--faint);
    padding:5px 11px; border-radius:999px; border:1px solid transparent;}
  .stagepill .dot{width:8px; height:8px; border-radius:50%; background:var(--border-strong);}
  .stagepill.active{color:var(--accent-ink); background:var(--accent-soft); border-color:#d7e0ea; font-weight:600;}
  .stagepill.active .dot{background:var(--accent);}
  .stagepill.done{color:var(--good);}
  .stagepill.done .dot{background:var(--good);}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
    box-shadow:0 1px 2px rgba(40,40,30,.04), 0 8px 30px rgba(40,40,30,.04); padding:30px 40px;
    width:100%; max-width:1000px; margin-inline:auto;}
  h1{font-family:var(--serif); font-weight:600; font-size:30px; line-height:1.2; margin:0 0 6px; letter-spacing:-.01em;}
  h2{font-family:var(--serif); font-weight:600; font-size:23px; margin:0 0 14px;}
  .lead{color:var(--muted); font-size:16.5px; max-width:62ch;}
  p{margin:0 0 14px;}
  .eyebrow{font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent);
    font-weight:700; margin-bottom:14px;}
  a{color:var(--accent);}

  /* ---- buttons ---- */
  .btn{font:inherit; font-weight:600; font-size:15px; border-radius:var(--r-sm); cursor:pointer;
    padding:13px 26px; border:1px solid var(--accent); background:var(--accent); color:#fff;
    transition:background .15s,border-color .15s,opacity .15s; -webkit-appearance:none;}
  .btn:hover{background:var(--accent-ink); border-color:var(--accent-ink);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn.ghost{background:transparent; color:var(--accent); }
  .btn.ghost:hover{background:var(--accent-soft);}
  .actions{display:flex; justify-content:space-between; align-items:center; gap:16px; margin-top:30px;}
  .actions .right{margin-left:auto;}

  .field{margin:18px 0;}
  label.q{display:block; font-weight:600; margin-bottom:6px;}
  .help{color:var(--muted); font-size:14px;}
  ul.clean{margin:8px 0 18px; padding-left:20px; color:var(--muted);}
  ul.clean li{margin-bottom:6px;}

  .divider{height:1px; background:var(--border); margin:26px 0;}

  /* ---- choice option lists (expertise, etc.) ---- */
  .opts{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .opt{display:flex; gap:13px; align-items:flex-start; padding:15px 17px; border:1px solid var(--border-strong);
    border-radius:var(--r-sm); cursor:pointer; background:var(--surface-2); transition:border-color .12s, background .12s;}
  .opt:hover{border-color:var(--accent);}
  .opt.sel{border-color:var(--accent); background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent);}
  .opt .marker{width:18px; height:18px; border-radius:50%; border:2px solid var(--border-strong); margin-top:2px; flex:none;}
  .opt.sel .marker{border-color:var(--accent); background:radial-gradient(circle at center, var(--accent) 0 5px, transparent 6px);}
  .opt .ttl{font-weight:600;}
  .opt .sub{color:var(--muted); font-size:14px;}

  /* ---- trial layout ---- */
  .trialhead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:18px;}
  .trialhead .count{color:var(--faint); font-size:13px; font-variant-numeric:tabular-nums;}
  .qtext{font-family:var(--serif); font-size:21px; font-weight:600; margin:0 0 20px;}
  .qtext .em{color:var(--accent-ink);}

  .pair{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .imgcell{display:flex; flex-direction:column; gap:8px; align-items:center;}
  .imgcell .cap{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:600; align-self:flex-start;}
  .frame{border:1px solid var(--border-strong); border-radius:var(--r-sm); overflow:hidden; background:#000; aspect-ratio:1/1; position:relative;}
  .frame img{display:block; width:100%; height:100%; object-fit:cover;}
  /* viewport-fit image sizing: drive images by available height so the Next button stays in view */
  .imgcell .frame{aspect-ratio:1/1; width:auto; max-width:100%;}
  .pair .frame{height:min(44vh,380px);}
  .withlegend .frame{height:min(40vh,340px);}
  .maskstrip .frame{height:min(23vh,195px);}
  .gencard .frame{height:auto; width:100%; aspect-ratio:1/1;}
  .s4frame{height:min(46vh,420px); width:auto; aspect-ratio:1/1; margin:0 auto 8px;}

  .withlegend{display:grid; grid-template-columns:1fr 1fr 190px; gap:18px; align-items:start;}
  @media(max-width:820px){ .withlegend{grid-template-columns:1fr 1fr;} .legend{grid-column:1/-1;} }

  .legend{border:1px solid var(--border); border-radius:var(--r-sm); padding:14px 16px; background:var(--surface-2);}
  .legend h4{margin:0 0 10px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);}
  .legend .row{display:flex; align-items:center; gap:9px; margin-bottom:7px; font-size:13px;}
  .legend .row:last-child{margin-bottom:0;}
  .legend .sw{width:16px; height:16px; border-radius:4px; border:1px solid rgba(0,0,0,.18); flex:none;}
  .legend.horiz{display:flex; flex-wrap:wrap; align-items:center; gap:7px 16px; padding:9px 14px; margin-bottom:14px;}
  .legend.horiz .hl{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-right:2px;}
  .legend.horiz .row{margin:0;}

  .maskrow{display:grid; grid-template-columns:1fr 1fr 190px; gap:18px; margin-bottom:18px; align-items:start;}
  .maskrow .frame{height:min(28vh,260px); width:auto; aspect-ratio:1/1;}
  @media(max-width:820px){ .maskrow{grid-template-columns:1fr 1fr;} .maskrow .legend{grid-column:1/-1;} }

  /* binary / segmented choices */
  .binary{display:flex; gap:14px; margin-top:6px;}
  .binary .chip{flex:1; text-align:center; padding:16px; border:1px solid var(--border-strong);
    border-radius:var(--r-sm); cursor:pointer; font-weight:600; background:var(--surface-2); transition:.12s;}
  .binary .chip:hover{border-color:var(--accent);}
  .binary .chip.sel{border-color:var(--accent); background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent); color:var(--accent-ink);}
  .binary .chip .k{display:block; font-size:12px; color:var(--faint); font-weight:600; letter-spacing:.06em; margin-top:3px;}
  .binary .chip.sel .k{color:var(--accent);}

  /* likert */
  .likert{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-top:8px;}
  .likert .step{padding:14px 8px; text-align:center; border:1px solid var(--border-strong);
    border-radius:var(--r-sm); cursor:pointer; background:var(--surface-2); transition:.12s;}
  .likert .step:hover{border-color:var(--accent);}
  .likert .step.sel{border-color:var(--accent); background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent);}
  .likert .step .num{font-family:var(--serif); font-size:24px; font-weight:600;}
  .likert .step .lab{display:block; font-size:11.5px; color:var(--muted); margin-top:2px; min-height:1.4em;}
  .likert-ends{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-top:10px;}

  /* stage 3 three-up */
  .threeup{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:6px;}
  .gencard{border:1px solid var(--border-strong); border-radius:var(--r-sm); overflow:hidden; cursor:pointer; background:var(--surface-2); transition:.12s;}
  .gencard:hover{border-color:var(--accent);}
  .gencard.sel{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent);}
  .gencard .frame{border:0; border-radius:0; border-bottom:1px solid var(--border);}
  .gencard .pick{display:flex; align-items:center; justify-content:center; gap:8px; padding:11px; font-weight:600; font-size:14px; color:var(--muted);}
  .gencard.sel .pick{color:var(--accent-ink);}
  .gencard .pick .mk{width:16px; height:16px; border-radius:50%; border:2px solid var(--border-strong);}
  .gencard.sel .pick .mk{border-color:var(--accent); background:radial-gradient(circle at center, var(--accent) 0 4px, transparent 5px);}
  .maskstrip{display:grid; grid-template-columns:240px 1fr; gap:18px; align-items:start; margin-bottom:20px;}
  .maskstrip.has-ref{grid-template-columns:1fr 1fr 190px;}
  @media(max-width:680px){ .maskstrip,.maskstrip.has-ref{grid-template-columns:1fr;} .threeup{grid-template-columns:1fr;} .pair{grid-template-columns:1fr;} }

  .attention{border:1px dashed var(--warn); background:#fbf4ee; border-radius:var(--r-sm); padding:14px 16px; margin-bottom:18px; color:var(--warn); font-weight:600;}

  .barfill{height:3px; background:var(--border); border-radius:2px; overflow:hidden; margin-top:14px;}
  .barfill > i{display:block; height:100%; background:var(--accent); width:0; transition:width .3s;}

  .demo-banner{flex:none; font-size:12.5px; color:var(--warn); background:#fbf4ee; border:1px solid #efe0d2;
    border-radius:var(--r-sm); padding:8px 12px; margin:14px auto 0; width:calc(100% - 48px); max-width:1000px; display:none;}
  .center{text-align:center;}
  .muted{color:var(--muted);}
  .small{font-size:13.5px;}
  kbd{font:inherit; font-size:12px; background:var(--surface-2); border:1px solid var(--border-strong);
    border-bottom-width:2px; border-radius:4px; padding:1px 6px; color:var(--muted);}

  /* short viewports: tighten chrome so trials stay within one screen */
  @media(max-height:760px){
    .card{padding:22px 32px;}
    h1{font-size:25px;}
    .qtext{font-size:19px; margin-bottom:14px;}
    .actions{margin-top:20px;}
    #screen{padding:14px 24px;}
  }
  /* ---- image loading spinner ---- */
  @keyframes spin{to{transform:rotate(360deg)}}
  .frame::after{
    content:''; position:absolute; top:50%; left:50%;
    width:22px; height:22px; margin:-11px 0 0 -11px;
    border:2.5px solid rgba(255,255,255,.15);
    border-top-color:rgba(255,255,255,.65);
    border-radius:50%; animation:spin .7s linear infinite;
    pointer-events:none;
  }
  .frame.img-loaded::after{display:none;}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-inner">
    <div class="brand">ADEM<span>Synthetic Imagery Perception Study</span></div>
    <div class="stages" id="stagepills"></div>
  </div>
</header>

<main class="wrap">
  <div id="demoBanner" class="demo-banner"></div>
  <div id="screen"></div>
</main>

<script>
// ============================================================================
//  Config / class legend
// ============================================================================
const LEGEND = [
  ["Tree",[0,100,0]],["Shrub",[255,182,193]],["Grass",[154,205,50]],
  ["Crop",[255,215,0]],["Built-up",[139,69,19]],["Barren",[211,211,211]],["Water",[0,0,255]]
];
const STAGE_META = {
  stage1:{n:"1",label:"Transforms",title:"Same scene or not?"},
  stage2:{n:"2",label:"Mask check",title:"Mask correctness"},
  stage3:{n:"3",label:"Generators",title:"Best generated image"},
  stage4:{n:"4",label:"Realism",title:"How realistic?"}
};
const STAGE_ORDER = ["stage1","stage2","stage3","stage4"];

let STUDY=null, RESULTS=[], EXPERTISE="", PARTICIPANT="";
let flatTrials=[], pos=0, trialStart=0, current=null, DEMO=false;

// ============================================================================
//  Boot — fetch the plan from Flask; fall back to a self-contained mock
// ============================================================================
async function boot(){
  try{
    const res = await fetch("/api/study");
    if(!res.ok) throw new Error("bad status");
    STUDY = await res.json();
  }catch(e){
    DEMO = true;
    STUDY = buildMockStudy();
    const b=document.getElementById("demoBanner");
    b.style.display="block";
    b.textContent="Preview mode — placeholder imagery. On your server the four stages load real images from your dataset folders.";
  }
  PARTICIPANT = STUDY.participant_id;
  renderStagePills(-1);
  showConsent();
}

// ============================================================================
//  Stage pills
// ============================================================================
function renderStagePills(activeIdx){
  const el=document.getElementById("stagepills"); el.innerHTML="";
  STAGE_ORDER.forEach((s,i)=>{
    const m=STAGE_META[s];
    const cls = i<activeIdx?"done":(i===activeIdx?"active":"");
    el.insertAdjacentHTML("beforeend",
      `<div class="stagepill ${cls}"><span class="dot"></span>${m.n}. ${m.label}</div>`);
  });
}

// ============================================================================
//  Screen: consent
// ============================================================================
function showConsent(){
  renderStagePills(-1);
  document.getElementById("screen").innerHTML = `
  <div class="card">
    <div class="eyebrow">Informed consent</div>
    <h1>Perception study on synthetic remote-sensing imagery</h1>
    <p class="lead">You will view satellite images and segmentation masks and answer short perceptual questions 
    across four brief stages. The study takes roughly 6 minutes.</p>
    <div class="divider"></div>
    <p><strong>What we collect.</strong> Only your answers, the time taken per question, an anonymous
    session ID, and your self-reported remote-sensing experience. We do <strong>not</strong> collect
    your name, email, IP address, or any identifying information.</p>
    <ul class="clean">
      <li>Participation is voluntary; you may stop at any time by closing the tab.</li>
      <li>Responses are anonymous and used only for aggregate academic research.</li>
      <li>There are no right or wrong answers — we are interested in your honest perception.</li>
    </ul>
    <p class="small muted">By continuing you confirm you are 18+ and consent to participation under these terms.</p>
    <div class="actions">
      <div class="small muted">Session <code>${PARTICIPANT}</code></div>
      <button class="btn right" onclick="showDemographics()">I consent — continue</button>
    </div>
  </div>`;
}

// ============================================================================
//  Screen: expertise
// ============================================================================
const EXP_OPTS=[
  ["none","No experience","I rarely look at aerial or satellite imagery."],
  ["some","Some familiarity","I occasionally work with maps or remote-sensing imagery."],
  ["expert","Domain expert","I work professionally with remote sensing / GIS / earth observation."]
];
function showDemographics(){
  renderStagePills(-1);
  document.getElementById("screen").innerHTML = `
  <div class="card">
    <div class="eyebrow">Before we start</div>
    <h2>Your experience with remote-sensing imagery</h2>
    <p class="help">This single question helps us account for expertise in the analysis. Pick the closest.</p>
    <div class="opts" id="expopts"></div>
    <div class="actions">
      <button class="btn ghost" onclick="showConsent()">Back</button>
      <button class="btn right" id="expnext" disabled onclick="startStudy()">Continue</button>
    </div>
  </div>`;
  const c=document.getElementById("expopts");
  EXP_OPTS.forEach(([v,t,s])=>{
    c.insertAdjacentHTML("beforeend",
      `<div class="opt" data-v="${v}" onclick="pickExp(this)">
         <div class="marker"></div><div><div class="ttl">${t}</div><div class="sub">${s}</div></div>
       </div>`);
  });
}
function pickExp(el){
  document.querySelectorAll("#expopts .opt").forEach(o=>o.classList.remove("sel"));
  el.classList.add("sel"); EXPERTISE=el.dataset.v;
  document.getElementById("expnext").disabled=false;
}

// ============================================================================
//  Flatten trials and add per-stage instruction screens
// ============================================================================
function startStudy(){
  flatTrials=[];
  STAGE_ORDER.forEach((sid,si)=>{
    const stage = STUDY.stages.find(s=>s.id===sid);
    if(!stage) return;
    flatTrials.push({intro:sid, stageIdx:si});
    stage.trials.forEach((t,ti)=>flatTrials.push(
      {trial:t, stage:sid, stageIdx:si, idxInStage:ti, totalInStage:stage.trials.length}));
  });
  pos=0; renderNext();
}

function renderNext(){
  if(pos>=flatTrials.length){ return showOutro(); }
  const item=flatTrials[pos];
  if(item.intro){ renderStageIntro(item); }
  else { renderTrial(item); }
}

// ============================================================================
//  Stage intro screens
// ============================================================================
const STAGE_INTRO={
  stage1:{eyebrow:"Stage 1 of 4 · Transforms",
    h:"Same scene, or different?",
    body:"You'll see two images side by side. The right image may be altered — rotated, flipped, cropped, noisy, or warped. Ignore those alterations and judge only whether <strong>both images show the same underlying scene</strong>.",
    pts:["Look past the distortion — focus on the content / layout of the scene.","Some pairs really are different scenes. Say <em>Different</em> when they are.","There are no trick gradients — just your honest read."]},
  stage2:{eyebrow:"Stage 2 of 4 · Mask check",
    h:"Does the mask match the image?",
    body:"Each screen shows an image and a colour-coded segmentation mask. Using the legend, decide whether the mask <strong>correctly describes that image</strong>. Some masks belong to a different image.",
    pts:["The legend (always on the right) maps each colour to a land-cover class.","Check that major regions line up — water, built-up, vegetation.","Answer <em>No</em> if the mask clearly belongs to another scene."]},
  stage3:{eyebrow:"Stage 3 of 4 · Generators",
    h:"Which generated image is best?",
    body:"You'll see one segmentation mask and three images generated from it by different models. Pick the <strong>single image that best fits the mask and looks most realistic</strong>.",
    pts:["The three are shown in random order each time.","Weigh both faithfulness to the mask <em>and</em> realism.","Choose the one you'd most believe is a real aerial photo of that layout."]},
  stage4:{eyebrow:"Stage 4 of 4 · Realism",
    h:"How realistic is each image?",
    body:"You'll rate single images on a 1–5 scale, from <strong>completely synthetic</strong> to <strong>completely real</strong>. Go with your first impression.",
    pts:["1 = you're confident it's computer-generated.","5 = you're confident it's a genuine photograph.","Use the middle values when you're unsure."]}
};
function renderStageIntro(item){
  renderStagePills(item.stageIdx);
  const s=STAGE_INTRO[item.intro];
  const congrats = item.stageIdx > 0
    ? `<div style="background:#edf5f0;border:1px solid #b8d5c4;border-radius:var(--r-sm);padding:11px 15px;margin-bottom:22px;color:var(--good);font-size:14px;font-weight:600;">Stage ${item.stageIdx} complete — well done.</div>`
    : "";
  document.getElementById("screen").innerHTML=`
  <div class="card">
    ${congrats}
    <div class="eyebrow">${s.eyebrow}</div>
    <h1>${s.h}</h1>
    <p class="lead">${s.body}</p>
    <ul class="clean">${s.pts.map(p=>`<li>${p}</li>`).join("")}</ul>
    <div class="actions">
      <span class="small muted">4 stages &middot; ~6 minutes total</span>
      <button class="btn right" onclick="advance()">Begin stage</button>
    </div>
  </div>`;
}

// ============================================================================
//  Trial rendering
// ============================================================================
function legendHTML(horiz){
  const rows = LEGEND.map(([n,c])=>`<div class="row"><span class="sw" style="background:rgb(${c.join(',')})"></span>${n}</div>`).join("");
  if(horiz) return `<div class="legend horiz"><span class="hl">Classes</span>${rows}</div>`;
  return `<div class="legend"><h4>Class legend</h4>${rows}</div>`;
}
function stageCounter(item){
  const m=STAGE_META[item.stage];
  return `<span class="count">${m.n}. ${m.label} · ${item.idxInStage+1} / ${item.totalInStage}</span>`;
}

function renderTrial(item){
  renderStagePills(item.stageIdx);
  current={item, response:null};
  trialStart=performance.now();
  const t=item.trial;
  let body="";
  if(t.type==="attention")      body=tplAttention(t);
  else if(t.type==="s1_samediff")body=tplSameDiff(t);
  else if(t.type==="s2_maskcheck")body=tplMaskCheck(t);
  else if(t.type==="s3_bestpick")body=tplBestPick(t);
  else if(t.type==="s4_realism") body=tplRealism(t);

  const progress=(item.idxInStage)/item.totalInStage*100;
  document.getElementById("screen").innerHTML=`
  <div class="card">
    <div class="trialhead"><div class="eyebrow" style="margin:0">${STAGE_META[item.stage].title}</div>${stageCounter(item)}</div>
    ${body}
    <div class="actions">
      <button class="btn right" id="nextBtn" disabled onclick="commit()">Next</button>
    </div>
    <div class="barfill"><i style="width:${progress}%"></i></div>
  </div>`;
  // Mark already-cached images so the spinner clears immediately.
  requestAnimationFrame(()=>document.querySelectorAll('.frame img').forEach(i=>{
    if(i.complete&&i.naturalWidth>0) i.closest('.frame')?.classList.add('img-loaded');
  }));
}

// ---- templates ----
function tplSameDiff(t){
  return `
  <p class="qtext">Do these two images show the <span class="em">same scene</span>?</p>
  <div class="pair">
    <div class="imgcell"><span class="cap">Image A · original</span><div class="frame"><img src="${t.left}"></div></div>
    <div class="imgcell"><span class="cap">Image B · possibly altered</span><div class="frame"><img src="${t.right}"></div></div>
  </div>
  <div class="binary" style="margin-top:22px">
    <div class="chip" data-v="same" onclick="pick(this,'same')">Same scene<span class="k">they match</span></div>
    <div class="chip" data-v="different" onclick="pick(this,'different')">Different<span class="k">not the same</span></div>
  </div>`;
}
function tplMaskCheck(t){
  return `
  <p class="qtext">Does this mask <span class="em">correctly segment</span> the image?</p>
  <div class="withlegend">
    <div class="imgcell"><span class="cap">Image</span><div class="frame"><img src="${t.image}"></div></div>
    <div class="imgcell"><span class="cap">Segmentation mask</span><div class="frame"><img src="${t.mask}"></div></div>
    ${legendHTML()}
  </div>
  <div class="binary" style="margin-top:22px">
    <div class="chip" data-v="yes" onclick="pick(this,'yes')">Yes — it matches</div>
    <div class="chip" data-v="no" onclick="pick(this,'no')">No — it's wrong</div>
  </div>`;
}
function tplBestPick(t){
  const ref = t.reference
    ? `<div class="imgcell"><span class="cap">Real reference</span><div class="frame"><img src="${t.reference}"></div></div>`
    : "";
  return `
  <p class="qtext">Which generated image <span class="em">best matches the mask and looks most realistic</span>?</p>
  <div class="maskrow">
    ${ref}
    <div class="imgcell"><span class="cap">Conditioning mask</span><div class="frame"><img src="${t.mask}"></div></div>
    ${legendHTML()}
  </div>
  <div class="threeup">
    ${t.options.map((o,i)=>`
      <div class="gencard" data-v="${o.key}" onclick="pick(this,'${o.key}')">
        <div class="frame"><img src="${o.image}"></div>
        <div class="pick"><span class="mk"></span>Option ${i+1}</div>
      </div>`).join("")}
  </div>`;
}
const REAL_LABELS=["Completely<br>synthetic","Probably<br>synthetic","Unsure","Probably<br>real","Completely<br>real"];
function tplRealism(t){
  return `
  <p class="qtext">How <span class="em">realistic</span> is this image?</p>
  <div class="frame s4frame"><img src="${t.image}"></div>
  <div class="likert">
    ${[1,2,3,4,5].map((n,i)=>`
      <div class="step" data-v="${n}" onclick="pick(this,${n})">
        <span class="num">${n}</span><span class="lab">${REAL_LABELS[i]}</span>
      </div>`).join("")}
  </div>
  <div class="likert-ends"><span>← computer-generated</span><span>genuine photograph →</span></div>`;
}
function tplAttention(t){
  const opts=[1,2,3,4,5].slice(0,5);
  return `
  <div class="attention">${t.prompt}</div>
  <p class="qtext">Please confirm you're paying attention.</p>
  <div class="likert">
    ${opts.map(n=>`<div class="step" data-v="${n}" onclick="pick(this,${n})"><span class="num">${n}</span></div>`).join("")}
  </div>`;
}

// ---- selection / commit ----
function pick(el,val){
  const grp=el.parentElement;
  grp.querySelectorAll("[data-v]").forEach(o=>o.classList.remove("sel"));
  el.classList.add("sel");
  current.response=val;
  document.getElementById("nextBtn").disabled=false;
}
function commit(){
  const it=current.item, t=it.trial;
  RESULTS.push({
    trial_id:t.trial_id, type:t.type, stage:it.stage,
    response:current.response,
    reaction_time_ms:Math.round(performance.now()-trialStart),
    client_timestamp:new Date().toISOString()
  });
  advance();
}
function advance(){ pos++; renderNext(); window.scrollTo(0,0); }

// ============================================================================
//  Outro + submit
// ============================================================================
async function showOutro(){
  renderStagePills(4);
  document.getElementById("screen").innerHTML=`
  <div class="card center">
    <div class="eyebrow">Submitting…</div>
    <h1>Saving your responses</h1>
    <p class="lead" style="margin:0 auto">One moment.</p>
  </div>`;
  let ok=true, info="";
  try{
    if(DEMO) throw new Error("demo");
    const r=await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({participant_id:PARTICIPANT, expertise:EXPERTISE, responses:RESULTS})});
    const j=await r.json(); ok=(j.status==="success"); info=j.sink?`(${j.sink})`:"";
  }catch(e){ ok=DEMO?true:false; }
  document.getElementById("screen").innerHTML=`
  <div class="card center">
    <div class="eyebrow" style="color:var(--good)">Complete</div>
    <h1>Thank you for taking part</h1>
    <p class="lead" style="margin:0 auto 8px">Your ${RESULTS.length} responses have been ${ok?"recorded":"collected"}.
    ${DEMO?"<br><span class='small muted'>(Preview mode — nothing was sent.)</span>":""}</p>
    ${!ok&&!DEMO?`<p class="small" style="color:var(--warn)">We couldn't reach the server — please notify the researcher (session ${PARTICIPANT}).</p>`:""}
    <p class="small muted">Your contribution supports research on synthetic data for earth observation.<br>— Ümit Mert Çağlar</p>
  </div>`;
}

// ============================================================================
//  MOCK STUDY (preview only) — placeholder SVG imagery
// ============================================================================
function ph(label,seed,kind){
  const hues={img:[34,'#caa46a','#8a6d3b'],mask:[150,'#7da06a','#4a6b3f'],gen:[210,'#7d92ad','#4a5d78'],real:[0,'#b08a8a','#7d5a5a']};
  const k=hues[kind]||hues.img;
  const r=(s)=>{s=Math.sin(s*99.7)*1e4;return s-Math.floor(s);};
  let rects="";
  for(let i=0;i<22;i++){const x=r(seed+i)*100,y=r(seed+i*2)*100,w=4+r(seed+i*3)*16,h=4+r(seed+i*4)*16;
    rects+=`<rect x="${x}%" y="${y}%" width="${w}%" height="${h}%" fill="${i%3?k[1]:k[2]}" opacity="${0.25+r(seed+i)*0.4}"/>`;}
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'>
    <rect width='100%' height='100%' fill='${kind==='mask'?'#0a0f0a':'#1c1a15'}'/>
    ${rects}
    <rect width='100%' height='100%' fill='none' stroke='rgba(255,255,255,.06)'/>
    <text x='50%' y='94%' fill='rgba(255,255,255,.5)' font-family='monospace' font-size='11' text-anchor='middle'>${label}</text>
  </svg>`;
  return "data:image/svg+xml;utf8,"+encodeURIComponent(svg);
}
function buildMockStudy(){
  const T=["baseline","noise","perspective","rotation","flip","resizedcrop","combined"];
  const s1=[]; let i=0;
  for(let n=0;n<2;n++) T.forEach(t=>{s1.push({trial_id:`s1_${i}`,type:"s1_samediff",
    left:ph(`scene ${n}`,n+1,'img'),right:ph(`scene ${n} · ${t}`,(n+1)*9+T.indexOf(t),'img')});i++;});
  s1.push({trial_id:`s1_${i++}`,type:"s1_samediff",left:ph("scene 0",1,'img'),right:ph("scene 7 · rotation",77,'img')});
  const s2=[]; for(let n=0;n<4;n++){const wrong=n%2===0;
    s2.push({trial_id:`s2_${n}`,type:"s2_maskcheck",image:ph(`image ${n}`,n+20,'img'),
      mask:ph(wrong?`mask ${n+1} (swapped)`:`mask ${n}`,(wrong?n+1:n)+40,'mask')});}
  const gens=["ARAS-CSD-1E7","ARAS-CSD-2","ARAS-C-UNetGAN"];
  const s3=[]; for(let n=0;n<3;n++){const ord=[...gens].sort(()=>Math.random()-.5);
    s3.push({trial_id:`s3_${n}`,type:"s3_bestpick",reference:ph(`real ${n}`,n+90,'real'),mask:ph(`mask ${n}`,n+60,'mask'),
      options:ord.map((g,j)=>({key:g,image:ph(g,(n+1)*7+j,'gen')}))});}
  const folders=[["ARAS400k-cnet",1],["ARAS-CSD-1E7",0],["ARAS-CSD-2",0],["ARAS-C-UNetGAN",0],
    ["ARAS400k_real",1],["ARAS400k_synth",0],["diverse",0],["BELDECN",1],["BELDEK",1]];
  const s4=[]; let j=0; folders.forEach(([f,real])=>{for(let k=0;k<1;k++){
    s4.push({trial_id:`s4_${j}`,type:"s4_realism",image:ph(`${f}`,j+80,real?'real':'gen')});j++;}});
  s4.splice(2,0,{trial_id:"attn_s4",type:"attention",render_as:"s4_realism",target:3,prompt:"Attention check — please select option 3."});
  return {participant_id:"demo_"+Math.random().toString(36).slice(2,8),legend:LEGEND,
    stages:[{id:"stage1",trials:s1},{id:"stage2",trials:s2},{id:"stage3",trials:s3},{id:"stage4",trials:s4}]};
}

// Remove spinner once an image inside a .frame finishes loading.
document.addEventListener('load', function(e){
  if(e.target.tagName==='IMG'){
    const f=e.target.closest('.frame');
    if(f) f.classList.add('img-loaded');
  }
}, true);

boot();
